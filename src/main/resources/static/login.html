<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 Rising Stones 登录</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #6B7B8A;
            --primary-light: #8A9BA8;
            --success: #7BAF7B;
            --danger: #C47B7B;
            --warning: #D4B87A;
            --bg: #F5F6F7;
            --card-bg: #FFFFFF;
            --text-primary: #3D454D;
            --text-secondary: #6B7B8A;
            --border: #E8EAEB;
            --shadow: 0 2px 8px rgba(107, 123, 138, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .login-container {
            margin-top: 20px;
        }
        
        .status {
            margin: 20px 0;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status.success {
            background-color: rgba(123, 175, 123, 0.1);
            color: var(--success);
            border: 1px solid rgba(123, 175, 123, 0.2);
        }
        
        .status.error {
            background-color: rgba(196, 123, 123, 0.1);
            color: var(--danger);
            border: 1px solid rgba(196, 123, 123, 0.2);
        }
        
        .status.info {
            background-color: rgba(107, 123, 138, 0.1);
            color: var(--text-secondary);
            border: 1px solid rgba(107, 123, 138, 0.2);
        }
        
        .status.warning {
            background-color: rgba(212, 184, 122, 0.1);
            color: var(--warning);
            border: 1px solid rgba(212, 184, 122, 0.2);
        }
        
        #qrCodeContainer {
            margin: 20px auto;
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        #qrcode {
            width: 250px;
            height: 250px;
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        #qrcode canvas {
            width: 220px !important;
            height: 220px !important;
        }
        
        .qr-info {
            margin: 20px 0;
            padding: 16px;
            background-color: var(--bg);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            display: none;
        }
        
        .qr-info a {
            color: var(--primary);
            text-decoration: none;
            word-break: break-all;
            font-weight: 500;
        }
        
        .qr-info a:hover {
            text-decoration: underline;
        }
        
        .countdown {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 10px;
            text-align: center;
        }
        
        .qr-expired {
            color: var(--danger);
            font-weight: 600;
        }
        
        .mobile-hint {
            background-color: rgba(212, 184, 122, 0.08);
            border: 1px solid rgba(212, 184, 122, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
            font-size: 13px;
            color: var(--text-secondary);
            display: none;
            text-align: center;
        }
        
        .button-group {
            text-align: center;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 32px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        button:hover {
            background-color: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(107, 123, 138, 0.2);
        }
        
        button:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        button.success {
            background-color: var(--success);
        }
        
        button.success:hover {
            background-color: #6A9B6A;
            box-shadow: 0 4px 12px rgba(123, 175, 123, 0.2);
        }
        
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .login-success-section {
            display: none;
            margin-top: 20px;
            padding: 24px;
            background-color: rgba(123, 175, 123, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(123, 175, 123, 0.2);
            text-align: center;
        }
        
        .login-success-section h3 {
            margin-top: 0;
            color: var(--success);
            font-size: 18px;
            margin-bottom: 12px;
        }
        
        .login-success-section p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .login-success-section a {
            color: var(--success);
            font-weight: 600;
            text-decoration: none;
        }
        
        .login-success-section a:hover {
            text-decoration: underline;
        }
        
        .continue-btn {
            margin-top: 16px;
            background-color: var(--success);
        }
        
        .continue-btn:hover {
            background-color: #6A9B6A;
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FF14 Rising Stones</h1>
            <p>使用叨鱼APP扫描二维码登录</p>
        </div>
        
        <div class="login-container">
            <div class="status info" id="status">
                点击下方按钮开始登录
            </div>
            
            <div id="qrCodeContainer">
                <div id="qrcode"></div>
            </div>
            
            <div id="qrInfo" class="qr-info">
                <p>请使用叨鱼APP扫描上方二维码，或点击链接在手机中打开：</p>
                <p><a href="#" id="qrLink" target="_blank" rel="noopener noreferrer"></a></p>
            </div>
            
            <div class="mobile-hint" id="mobileHint">
                如果二维码无法扫描，请尝试将上方链接复制到手机浏览器打开
            </div>
            
            <div id="loginSuccessSection" class="login-success-section">
                <h3>🎉 登录成功！</h3>
                <p id="successMessage">账号已保存</p>
                <p>您可以前往 <a href="accounts-view.html">账号概览</a> 查看所有账号。</p>
                <button class="continue-btn" onclick="generateQrCode()">继续添加账号</button>
            </div>
            
            <div class="button-group" id="buttonGroup">
                <button onclick="generateQrCode()" id="generateBtn">生成登录二维码</button>
            </div>
        </div>
        
        <div class="footer">
            <p>登录后自动完成角色绑定</p>
        </div>
    </div>
    
    <script>
        let checkInterval = null;
        let qrExpireTimer = null;
        let qrExpireTime = null;
        let qrCodeInstance = null;
        const baseUrl = '';
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面已加载');
            if (typeof QRCode === 'undefined') {
                console.error('QRCode库未加载！');
                showStatus('二维码库加载失败，部分功能可能受限', 'warning');
            }
        });
        
        async function generateQrCode() {
            showStatus('正在生成二维码...', 'info');
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('loginSuccessSection').style.display = 'none';
            document.getElementById('buttonGroup').style.display = 'block';
            
            try {
                const response = await fetch(`${baseUrl}/api/ffxiv/signin/login/qrcode`);
                const data = await response.json();
                
                if (data.success) {
                    const qrCodeUrl = data.data;
                    showStatus('二维码已生成，请使用叨鱼APP扫描', 'info');
                    
                    document.getElementById('qrCodeContainer').style.display = 'flex';
                    document.getElementById('qrInfo').style.display = 'block';
                    document.getElementById('mobileHint').style.display = 'block';
                    
                    generateQRCodeImage(qrCodeUrl);
                    
                    const qrLink = document.getElementById('qrLink');
                    qrLink.href = qrCodeUrl;
                    qrLink.textContent = qrCodeUrl;
                    
                    setQrExpireTimer(120);
                    startPolling();
                } else {
                    showStatus(`生成二维码失败: ${data.message}`, 'error');
                    document.getElementById('generateBtn').disabled = false;
                }
            } catch (error) {
                showStatus(`生成二维码错误: ${error.message}`, 'error');
                document.getElementById('generateBtn').disabled = false;
            }
        }
        
        function generateQRCodeImage(url) {
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            
            try {
                if (typeof QRCode !== 'undefined') {
                    qrCodeInstance = new QRCode(qrcodeDiv, {
                        text: url,
                        width: 250,
                        height: 250,
                        colorDark: "#3D454D",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } else {
                    showQRCodeFallback(url, qrcodeDiv);
                }
            } catch (error) {
                showQRCodeFallback(url, qrcodeDiv);
            }
        }
        
        function showQRCodeFallback(url, container) {
            container.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <p style="color: var(--danger); margin-bottom: 10px;">二维码生成失败</p>
                    <p style="margin-bottom: 10px;">请直接点击下方链接：</p>
                    <a href="${url}" target="_blank" style="color: var(--primary); word-break: break-all;">
                        ${url}
                    </a>
                    <p style="margin-top: 10px; font-size: 12px; color: var(--text-secondary);">
                        或者复制链接到叨鱼APP中打开
                    </p>
                </div>
            `;
        }
        
        function setQrExpireTimer(seconds) {
            if (qrExpireTimer) {
                clearInterval(qrExpireTimer);
            }
            
            qrExpireTime = Date.now() + seconds * 1000;
            updateCountdown();
            
            qrExpireTimer = setInterval(() => {
                updateCountdown();
            }, 1000);
        }
        
        function updateCountdown() {
            const now = Date.now();
            const remainingSeconds = Math.max(0, Math.floor((qrExpireTime - now) / 1000));
            
            const countdownElement = document.getElementById('countdown');
            if (!countdownElement) {
                const qrInfo = document.getElementById('qrInfo');
                const countdownDiv = document.createElement('div');
                countdownDiv.id = 'countdown';
                countdownDiv.className = 'countdown';
                qrInfo.appendChild(countdownDiv);
            }
            
            const el = document.getElementById('countdown');
            if (remainingSeconds > 0) {
                const minutes = Math.floor(remainingSeconds / 60);
                const seconds = remainingSeconds % 60;
                el.innerHTML = `二维码将在 <span style="color:var(--primary);font-weight:600;">${minutes}:${seconds.toString().padStart(2, '0')}</span> 后失效`;
            } else {
                el.innerHTML = '<span class="qr-expired">二维码已过期，请重新生成</span>';
                if (qrExpireTimer) {
                    clearInterval(qrExpireTimer);
                    qrExpireTimer = null;
                }
            }
        }
        
        function startPolling() {
            showStatus('正在检查登录状态...', 'info');
            checkLoginPoll();
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(checkLoginPoll, 2000);
        }
        
        async function checkLoginPoll() {
            try {
                const response = await fetch(`${baseUrl}/api/ffxiv/signin/login/status`);
                const data = await response.json();
                
                if (data.success) {
                    if (data.data.status === 'LOGIN_SUCCESS') {
                        const ticket = data.data.ticket;
                        showStatus('登录成功！正在完成登录流程...', 'info');
                        clearInterval(checkInterval);
                        checkInterval = null;
                        
                        if (qrExpireTimer) {
                            clearInterval(qrExpireTimer);
                            qrExpireTimer = null;
                        }
                        
                        document.getElementById('qrCodeContainer').style.display = 'none';
                        document.getElementById('qrInfo').style.display = 'none';
                        document.getElementById('mobileHint').style.display = 'none';
                        
                        finishLogin(ticket);
                    } else if (data.data.status === 'QRCODE_EXPIRED') {
                        showStatus('二维码已失效，请重新生成', 'error');
                        clearInterval(checkInterval);
                        checkInterval = null;
                        document.getElementById('generateBtn').disabled = false;
                    } else if (data.data.status === 'WAITING_FOR_SCAN') {
                        showStatus('等待用户扫描二维码...', 'info');
                    }
                } else {
                    showStatus(`检查登录状态失败: ${data.message}`, 'error');
                    clearInterval(checkInterval);
                    checkInterval = null;
                }
            } catch (error) {
                showStatus(`检查登录状态错误: ${error.message}`, 'error');
                clearInterval(checkInterval);
                checkInterval = null;
            }
        }
        
        async function finishLogin(ticket) {
            try {
                const response = await fetch(`${baseUrl}/api/ffxiv/signin/login/finish`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticket })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const accountId = data.data?.accountId;
                    showStatus('登录完成！正在获取角色绑定信息...', 'info');
                    await checkAndBindCharacter(accountId);
                } else {
                    showStatus(`完成登录失败: ${data.message}`, 'error');
                    document.getElementById('generateBtn').disabled = false;
                }
            } catch (error) {
                showStatus(`完成登录错误: ${error.message}`, 'error');
                document.getElementById('generateBtn').disabled = false;
            }
        }
        
        async function checkAndBindCharacter(accountId) {
            try {
                let url = `${baseUrl}/api/ffxiv/signin/character/bind-info`;
                if (accountId) {
                    url = `${baseUrl}/api/ffxiv/signin/character/bind-info/${accountId}`;
                }
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const bindInfo = data.data;
                    
                    if (bindInfo.code === 10105) {
                        showStatus(`⚠️ ${bindInfo.msg}`, 'error');
                        showStatus('请重新生成二维码登录', 'warning');
                        document.getElementById('generateBtn').disabled = false;
                        return;
                    }
                    
                    if (bindInfo.code === 10000) {
                        const userData = bindInfo.data || {};
                        const characterName = userData.character_name;
                        const serverName = userData.area_name;
                        
                        if (characterName) {
                            showLoginSuccess(`已绑定角色：${characterName}（${serverName || ''}）`);
                        } else {
                            showStatus('未找到可用角色，请先登录FF14游戏创建角色', 'warning');
                            showLoginSuccess('暂无绑定角色');
                        }
                    } else {
                        showStatus(`获取角色信息失败: ${bindInfo.msg || '未知错误'}`, 'warning');
                        showLoginSuccess('角色绑定失败');
                    }
                } else {
                    showStatus(`获取角色信息失败: ${data.message}`, 'warning');
                    showLoginSuccess('角色绑定失败');
                }
            } catch (error) {
                showStatus(`获取角色信息错误: ${error.message}`, 'warning');
                showLoginSuccess('角色绑定失败');
            }
        }
        
        function showLoginSuccess(message) {
            showStatus('登录成功！', 'success');
            document.getElementById('buttonGroup').style.display = 'none';
            document.getElementById('loginSuccessSection').style.display = 'block';
            document.getElementById('successMessage').textContent = message;
            document.getElementById('generateBtn').disabled = false;
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
    </script>
</body>
</html>
