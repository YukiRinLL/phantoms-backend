<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 Rising Stones 登录</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #6B7B8A;
            --primary-light: #8A9BA8;
            --success: #7BAF7B;
            --danger: #C47B7B;
            --warning: #D4B87A;
            --bg: #F5F6F7;
            --card-bg: #FFFFFF;
            --text-primary: #3D454D;
            --text-secondary: #6B7B8A;
            --border: #E8EAEB;
            --shadow: 0 2px 8px rgba(107, 123, 138, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 500px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .login-container {
            margin: 20px 0;
            padding: 24px;
            border: 2px solid var(--primary);
            border-radius: 12px;
            background-color: rgba(107, 123, 138, 0.03);
        }
        
        #qrCodeContainer {
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #qrcode {
            width: 250px;
            height: 250px;
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }
        
        .qr-info {
            margin: 15px 0;
            padding: 14px;
            background-color: rgba(107, 123, 138, 0.05);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(107, 123, 138, 0.2);
        }
        
        .btn-primary:disabled {
            background-color: var(--border);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-success {
            background-color: var(--success);
            color: white;
            width: 100%;
        }
        
        .btn-success:hover {
            background-color: #6A9B6A;
        }
        
        .status {
            margin: 15px 0;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status.success {
            background-color: rgba(123, 175, 123, 0.1);
            color: var(--success);
            border: 1px solid rgba(123, 175, 123, 0.2);
        }
        
        .status.error {
            background-color: rgba(196, 123, 123, 0.1);
            color: var(--danger);
            border: 1px solid rgba(196, 123, 123, 0.2);
        }
        
        .status.info {
            background-color: rgba(107, 123, 138, 0.1);
            color: var(--text-secondary);
            border: 1px solid rgba(107, 123, 138, 0.2);
        }
        
        .status.warning {
            background-color: rgba(212, 184, 122, 0.1);
            color: var(--warning);
            border: 1px solid rgba(212, 184, 122, 0.2);
        }
        
        .hidden {
            display: none;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--bg);
            color: var(--text-primary);
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .action-buttons .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FF14 Rising Stones</h1>
            <p>请扫描二维码登录</p>
        </div>

        <div id="statusMessage" class="status" style="display: none;"></div>

        <div id="loginSection">
            <div class="login-container">
                <div id="qrCodeContainer">
                    <div id="qrcode"></div>
                </div>
                <div class="qr-info">
                    使用 FF14 Rising Stones 手机客户端扫描二维码登录
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="startLogin()">生成二维码</button>
            </div>

            <div class="action-buttons">
                <button class="btn btn-success" onclick="checkLoginStatus()">检查登录状态</button>
            </div>
        </div>

        <div id="resultSection" class="hidden">
            <div class="status success" id="loginResult">登录成功！</div>
            <button class="btn btn-primary" onclick="finishLogin()">完成登录</button>
        </div>
    </div>

    <script>
        let qrcode = null;
        let loginStatusInterval = null;

        function showStatus(message, type) {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        async function startLogin() {
            try {
                showStatus('正在生成二维码...', 'info');
                
                const response = await fetch('/api/ffxiv/signin/login/start', {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const loginUrl = result.data.login_url;
                    
                    if (qrcode) {
                        qrcode.clear();
                    }
                    
                    qrcode = new QRCode(document.getElementById('qrcode'), {
                        text: loginUrl,
                        width: 230,
                        height: 230,
                        colorDark : "#3D454D",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                    
                    showStatus('请扫描二维码进行登录', 'info');
                    startPolling();
                } else {
                    showStatus('生成二维码失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('生成二维码失败: ' + error.message, 'error');
            }
        }

        function startPolling() {
            if (loginStatusInterval) {
                clearInterval(loginStatusInterval);
            }
            
            loginStatusInterval = setInterval(() => {
                checkLoginStatus();
            }, 3000);
        }

        function stopPolling() {
            if (loginStatusInterval) {
                clearInterval(loginStatusInterval);
                loginStatusInterval = null;
            }
        }

        async function checkLoginStatus() {
            try {
                const response = await fetch('/api/ffxiv/signin/login/status');
                const result = await response.json();
                
                if (result.success && result.data) {
                    const status = result.data.status;
                    
                    if (status === 'LOGIN_SUCCESS') {
                        stopPolling();
                        showStatus('登录成功！', 'success');
                        document.getElementById('loginSection').classList.add('hidden');
                        document.getElementById('resultSection').classList.remove('hidden');
                    } else if (status === 'WAITING_FOR_SCAN') {
                        showStatus('等待用户扫描二维码...', 'info');
                    } else if (status === 'EXPIRED') {
                        stopPolling();
                        showStatus('二维码已过期，请重新生成', 'warning');
                    }
                } else {
                    showStatus('检查登录状态失败: ' + result.message, 'error');
                }
            } catch (error) {
                console.log('检查登录状态失败:', error);
            }
        }

        async function finishLogin() {
            try {
                showStatus('正在完成登录...', 'info');
                
                const response = await fetch('/api/ffxiv/signin/login/finish', {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus('登录完成，正在跳转到账号列表...', 'success');
                    setTimeout(() => {
                        window.location.href = 'accounts-view.html';
                    }, 1500);
                } else {
                    showStatus('登录完成失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('登录完成失败: ' + error.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            startLogin();
        });
    </script>
</body>
</html>
