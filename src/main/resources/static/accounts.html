<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 Rising Stones 账号管理</title>
    <style>
        :root {
            --primary: #6B7B8A;
            --primary-light: #8A9BA8;
            --success: #7BAF7B;
            --danger: #C47B7B;
            --warning: #D4B87A;
            --bg: #F5F6F7;
            --card-bg: #FFFFFF;
            --text-primary: #3D454D;
            --text-secondary: #6B7B8A;
            --border: #E8EAEB;
            --shadow: 0 2px 8px rgba(107, 123, 138, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }
        
        .header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(107, 123, 138, 0.2);
        }
        
        .btn-success {
            background-color: var(--success);
            color: white;
        }
        
        .btn-success:hover {
            background-color: #6A9B6A;
        }
        
        .btn-warning {
            background-color: rgba(212, 184, 122, 0.1);
            color: var(--warning);
        }
        
        .btn-warning:hover {
            background-color: rgba(212, 184, 122, 0.2);
        }
        
        .btn-danger {
            background-color: rgba(196, 123, 123, 0.1);
            color: var(--danger);
        }
        
        .btn-danger:hover {
            background-color: rgba(196, 123, 123, 0.2);
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .search-bar input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--bg);
            color: var(--text-primary);
            transition: border-color 0.2s ease;
        }
        
        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .accounts-table {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .table-header {
            display: grid;
            grid-template-columns: 30px 140px 120px 140px 80px 80px 80px 80px 80px 260px;
            background-color: var(--bg);
            padding: 4px 12px;
            font-weight: 600;
            font-size: 11px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }
        
        .table-row {
            display: grid;
            grid-template-columns: 30px 140px 120px 140px 80px 80px 80px 80px 80px 260px;
            padding: 4px 12px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            transition: background-color 0.2s ease;
        }
        
        .table-row:hover {
            background-color: rgba(107, 123, 138, 0.03);
        }
        
        .table-row:last-child {
            border-bottom: none;
        }
        
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge.enabled {
            background-color: rgba(123, 175, 123, 0.15);
            color: var(--success);
        }
        
        .badge.disabled {
            background-color: rgba(196, 123, 123, 0.15);
            color: var(--danger);
        }
        
        .badge.api {
            background-color: rgba(107, 123, 138, 0.15);
            color: var(--primary);
        }
        
        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .action-buttons button {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .action-buttons button:hover:not(:disabled) {
            transform: translateY(-1px);
        }
        
        .action-buttons button:disabled {
            background-color: var(--border);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .action-buttons button.success {
            background-color: rgba(123, 175, 123, 0.15);
            color: var(--success);
        }
        
        .action-buttons button.success:hover {
            background-color: rgba(123, 175, 123, 0.25);
        }
        
        .action-buttons button.danger {
            background-color: rgba(196, 123, 123, 0.15);
            color: var(--danger);
        }
        
        .action-buttons button.danger:hover {
            background-color: rgba(196, 123, 123, 0.25);
        }
        
        .action-buttons button.api-btn {
            background-color: rgba(107, 123, 138, 0.15);
            color: var(--primary);
            cursor: default;
        }
        
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-secondary);
        }
        
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .status {
            margin: 15px 0;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            position: relative;
            z-index: 100;
        }
        
        .status.success {
            background-color: rgba(123, 175, 123, 0.1);
            color: var(--success);
            border: 1px solid rgba(123, 175, 123, 0.2);
        }
        
        .status.error {
            background-color: rgba(196, 123, 123, 0.1);
            color: var(--danger);
            border: 1px solid rgba(196, 123, 123, 0.2);
        }
        
        .status.info {
            background-color: rgba(107, 123, 138, 0.1);
            color: var(--text-secondary);
            border: 1px solid rgba(107, 123, 138, 0.2);
        }
        
        .status.warning {
            background-color: rgba(212, 184, 122, 0.1);
            color: var(--warning);
            border: 1px solid rgba(212, 184, 122, 0.2);
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background-color: var(--bg);
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .modal-close:hover {
            background-color: var(--border);
            color: var(--text-primary);
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--bg);
            color: var(--text-primary);
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        
        .modal-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .modal-actions button.secondary {
            background-color: var(--bg);
            color: var(--text-secondary);
        }
        
        .modal-actions button.secondary:hover {
            background-color: var(--border);
            color: var(--text-primary);
        }
        
        .batch-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .detail-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .detail-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .detail-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            padding-left: 8px;
            border-left: 3px solid var(--primary);
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }
        
        .detail-row label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .detail-row value {
            color: var(--text-primary);
            font-weight: 400;
        }
        
        @media (max-width: 768px) {
            .table-header {
                display: none;
            }
            
            .table-row {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 12px;
                border-bottom: 1px solid var(--border);
            }
            
            .table-row > div {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .table-row > div::before {
                content: attr(data-label);
                font-weight: 500;
                color: var(--text-secondary);
                font-size: 11px;
            }
            
            .section-header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
            
            .batch-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>账号管理</h1>
    </div>

    <div class="container">
        <div id="status" class="status" style="display: none;"></div>

        <div class="section">
            <div class="section-header">
                <h2>账号列表</h2>
            </div>

            <div class="batch-actions">
                <button class="btn btn-primary" onclick="manualSignInAll()">全部签到</button>
                <button class="btn btn-success" onclick="manualClaimRewards()">领取奖励</button>
                <button class="btn btn-warning" onclick="checkAllLoginStatus()">检查登录状态</button>
                <button class="btn btn-primary" onclick="loadAccounts()">刷新列表</button>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索账号或角色名..." onkeyup="renderTable()">
            </div>

            <div class="accounts-table">
                <div class="table-header">
                    <div>#</div>
                    <div>账号信息</div>
                    <div>角色名</div>
                    <div>服务器/部队</div>
                    <div>房屋信息</div>
                    <div>登录状态</div>
                    <div>账号状态</div>
                    <div>签到状态</div>
                    <div>奖励状态</div>
                    <div>操作</div>
                </div>
                <div id="accountsTable">
                    <div class="table-row">
                        <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>编辑账号</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            
            <form id="editForm" onsubmit="handleEditSubmit(event)">
                <input type="hidden" id="editAccountId">
                
                <div class="form-group">
                    <label for="editNickname">账号昵称</label>
                    <input type="text" id="editNickname" placeholder="输入账号昵称">
                </div>
                
                <div class="form-group">
                    <label for="editEnabled">启用状态</label>
                    <select id="editEnabled" style="width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background-color: var(--bg); color: var(--text-primary);">
                        <option value="true">已启用</option>
                        <option value="false">已禁用</option>
                    </select>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-success">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>确认删除</h2>
                <button class="modal-close" onclick="closeDeleteModal()">×</button>
            </div>
            
            <p id="deleteMessage" style="font-size: 14px; color: var(--text-secondary); margin-bottom: 24px;"></p>
            
            <div class="modal-actions">
                <button type="button" class="btn secondary" onclick="closeDeleteModal()">取消</button>
                <button type="button" class="btn btn-danger" onclick="deleteAccount()">删除</button>
            </div>
        </div>
    </div>

    <div id="characterDetailModal" class="modal-overlay">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h2>角色详情</h2>
                <button class="modal-close" onclick="closeCharacterDetailModal()">×</button>
            </div>
            <div id="characterDetailContent">
                <div class="empty-state">
                    <h3>加载中...</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAccounts = [];
        let deleteAccountId = null;

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        async function loadAccounts(showLoading = true) {
            try {
                if (showLoading) {
                    showStatus('正在加载账号列表...', 'info');
                }
                const response = await fetch('/api/ffxiv/signin/accounts');
                if (!response.ok) {
                    throw new Error('获取账号列表失败');
                }
                const result = await response.json();
                if (result.success) {
                    currentAccounts = result.data || [];
                    currentAccounts = currentAccounts.filter((account, index, self) => 
                        index === self.findIndex(a => a.accountId === account.accountId)
                    );
                    await loadAccountDetails();
                } else {
                    showStatus('获取账号列表失败: ' + result.message, 'error');
                    document.getElementById('accountsTable').innerHTML = 
                        '<div class="table-row"><div style="grid-column: 1 / -1; text-align: center; padding: 40px;">加载失败</div></div>';
                }
            } catch (error) {
                showStatus('加载失败: ' + error.message, 'error');
                document.getElementById('accountsTable').innerHTML = 
                    '<div class="table-row"><div style="grid-column: 1 / -1; text-align: center; padding: 40px;">加载失败，请检查网络连接</div></div>';
            }
        }

        async function loadAccountDetails() {
            currentAccounts.forEach(account => {
                account.characterName = '';
                account.serverName = '';
                account.groupName = '';
                account.guildName = '';
                account.houseInfoPublish = -1;
                account.loginError = false;
            });
            
            const promises = currentAccounts.filter(account => account.enabled).map(async (account) => {
                try {
                    const response = await fetch(`/api/ffxiv/signin/accounts/${account.accountId}/user-info`);
                    const data = await response.json();
                    
                    if (data.success && data.data) {
                        const apiResponse = data.data;
                        if (apiResponse.code === 10000 && apiResponse.data) {
                            const userData = apiResponse.data;
                            account.characterName = userData.character_name || '';
                            account.serverName = userData.group_name || '';
                            account.groupName = userData.group_name || '';
                            account.houseInfoPublish = userData.house_info_publish !== undefined ? userData.house_info_publish : -1;
                            account.profile = userData.profile || '';
                            
                            if (userData.characterDetail) {
                                if (Array.isArray(userData.characterDetail) && userData.characterDetail.length > 0) {
                                    const detail = userData.characterDetail[0];
                                    account.guildName = detail.guild_name || '';
                                    account.guildTag = detail.guild_tag || '';
                                    account.race = detail.race || '';
                                    account.tribe = detail.tribe || '';
                                    account.gender = detail.gender || '';
                                    account.playTime = detail.play_time || '';
                                    account.newrank = detail.newrank || '';
                                    account.crystalRank = detail.crystal_rank || '';
                                    account.createTime = detail.create_time || '';
                                    account.lastLoginTime = detail.last_login_time || '';
                                } else if (typeof userData.characterDetail === 'object') {
                                    const detail = userData.characterDetail;
                                    account.guildName = detail.guild_name || '';
                                    account.guildTag = detail.guild_tag || '';
                                    account.race = detail.race || '';
                                    account.tribe = detail.tribe || '';
                                    account.gender = detail.gender || '';
                                    account.playTime = detail.play_time || '';
                                    account.newrank = detail.newrank || '';
                                    account.crystalRank = detail.crystal_rank || '';
                                    account.createTime = detail.create_time || '';
                                    account.lastLoginTime = detail.last_login_time || '';
                                }
                            }
                        } else if (apiResponse.code === 10105) {
                            account.loginError = true;
                        }
                    }
                } catch (error) {
                    console.log(`Failed to load details for account ${account.accountId}:`, error);
                }
            });
            
            await Promise.all(promises);
            renderTable();
        }

        function renderTable() {
            const table = document.getElementById('accountsTable');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = currentAccounts.filter(a => 
                (a.nickname || a.accountId).toLowerCase().includes(searchTerm) ||
                (a.characterName || '').toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                table.innerHTML = '<div class="table-row"><div style="grid-column: 1 / -1; text-align: center; padding: 40px;">暂无数据</div></div>';
                return;
            }

            let html = '';
            filtered.forEach((account, index) => {
                html += `
                    <div class="table-row">
                        <div data-label="#">${index + 1}</div>
                        <div data-label="账号信息">
                            <div style="font-size: 12px;">${account.nickname || account.accountId}</div>
                        </div>
                        <div data-label="角色名">
                            ${account.characterName ? `<span style="font-weight: 500; font-size: 13px;">${account.characterName}</span>` : '<span style="color: var(--text-secondary); font-size: 11px;">未绑定</span>'}
                        </div>
                        <div data-label="服务器/部队">
                            <div style="font-size: 12px;">${account.serverName || '-'} / ${account.guildName || account.groupName || '-'}</div>
                        </div>
                        <div data-label="房屋信息">
                            <span style="font-size: 11px;">${account.houseInfoPublish === 1 ? '已发布' : (account.houseInfoPublish === 0 ? '未发布' : '-')}</span>
                        </div>
                        <div data-label="登录状态">
                            <span class="badge ${account.loginError ? 'disabled' : 'enabled'}">${account.loginError ? '登录失效' : '正常'}</span>
                        </div>
                        <div data-label="账号状态">
                            <span class="badge ${account.enabled ? 'enabled' : 'disabled'}">${account.enabled ? '已启用' : '已禁用'}</span>
                            ${account.defaultForApi ? '<span class="badge api" style="margin-left:4px;">默认API</span>' : ''}
                        </div>
                        <div data-label="签到状态">
                            ${getSignInStatus(account)}
                        </div>
                        <div data-label="奖励状态">
                            ${getRewardStatus(account)}
                        </div>
                        <div data-label="操作">
                            <div class="action-buttons">
                                <button onclick="editAccount('${account.accountId}', '${account.nickname || account.accountId}', ${account.enabled})">编辑</button>
                                ${account.enabled ? `
                                    <button onclick="toggleAccountStatus('${account.accountId}', false)">禁用</button>
                                    <button class="success" onclick="manualSignIn('${account.accountId}')">签到</button>
                                    <button onclick="manualClaimReward('${account.accountId}')">领奖励</button>
                                ` : `
                                    <button class="success" onclick="toggleAccountStatus('${account.accountId}', true)">启用</button>
                                    <button disabled>签到</button>
                                    <button disabled>领奖励</button>
                                `}
                                ${account.defaultForApi ? `
                                    <button class="api-btn" disabled>默认API</button>
                                ` : `
                                    <button onclick="setDefaultApiAccount('${account.accountId}')">设为API</button>
                                `}
                                <button class="danger" onclick="confirmDeleteAccount('${account.accountId}', '${account.nickname || account.accountId}')">删除</button>
                                ${account.characterName ? `<button onclick="openCharacterDetail('${account.accountId}')">详情</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            table.innerHTML = html;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getSignInStatus(account) {
            if (!account.enabled) {
                return '<span class="badge disabled" style="font-size: 11px;">已禁用</span>';
            }
            
            if (!account.lastSignInTime) {
                return '<span class="badge" style="font-size: 11px; background-color: rgba(212, 184, 122, 0.15); color: var(--warning);">未签到</span>';
            }
            
            const now = new Date();
            const lastSignIn = new Date(account.lastSignInTime);
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const lastSignInDate = new Date(lastSignIn.getFullYear(), lastSignIn.getMonth(), lastSignIn.getDate());
            
            const diffDays = Math.floor((today - lastSignInDate) / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) {
                if (account.lastSignInResult && account.lastSignInResult.includes('成功')) {
                    return '<span class="badge" style="font-size: 11px; background-color: rgba(123, 175, 123, 0.15); color: var(--success);">今日已签</span>';
                } else {
                    return '<span class="badge" style="font-size: 11px; background-color: rgba(196, 123, 123, 0.15); color: var(--danger);">签到失败</span>';
                }
            } else if (diffDays === 1) {
                return '<span class="badge" style="font-size: 11px; background-color: rgba(212, 184, 122, 0.15); color: var(--warning);">昨日已签</span>';
            } else {
                return '<span class="badge" style="font-size: 11px; background-color: rgba(212, 184, 122, 0.15); color: var(--warning);">已过期</span>';
            }
        }

        function getRewardStatus(account) {
            if (!account.enabled) {
                return '<span class="badge disabled" style="font-size: 11px;">已禁用</span>';
            }
            
            if (!account.lastSignInTime) {
                return '<span class="badge" style="font-size: 11px; color: var(--text-secondary);">-</span>';
            }
            
            const now = new Date();
            const lastSignIn = new Date(account.lastSignInTime);
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const lastSignInDate = new Date(lastSignIn.getFullYear(), lastSignIn.getMonth(), lastSignIn.getDate());
            
            const diffDays = Math.floor((today - lastSignInDate) / (1000 * 60 * 60 * 24));
            
            if (diffDays > 0) {
                return '<span class="badge" style="font-size: 11px; background-color: rgba(107, 123, 138, 0.15); color: var(--primary);">可领取</span>';
            }
            
            return '<span class="badge" style="font-size: 11px; color: var(--text-secondary);">今日已领</span>';
        }

        function editAccount(accountId, nickname, enabled) {
            showStatus('正在打开编辑对话框...', 'info');
            document.getElementById('editAccountId').value = accountId;
            document.getElementById('editNickname').value = nickname;
            document.getElementById('editEnabled').value = enabled;
            document.getElementById('editModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('show');
            showStatus('已取消编辑', 'info');
        }

        async function handleEditSubmit(event) {
            event.preventDefault();
            
            const accountId = document.getElementById('editAccountId').value;
            const nickname = document.getElementById('editNickname').value.trim();
            const enabled = document.getElementById('editEnabled').value === 'true';

            try {
                const response = await fetch(`/api/ffxiv/signin/accounts/${accountId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, enabled })
                });

                const result = await response.json();
                if (result.success) {
                    showStatus('账号更新成功', 'success');
                    closeModal();
                    loadAccounts();
                } else {
                    showStatus('更新失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('更新失败: ' + error.message, 'error');
            }
        }

        function confirmDeleteAccount(accountId, nickname) {
            showStatus('请确认删除操作...', 'warning');
            deleteAccountId = accountId;
            document.getElementById('deleteMessage').textContent = `确定要删除账号 "${nickname}" 吗？此操作不可撤销。`;
            document.getElementById('deleteModal').classList.add('show');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
            deleteAccountId = null;
            showStatus('已取消删除', 'info');
        }

        async function deleteAccount() {
            if (!deleteAccountId) return;

            try {
                const response = await fetch(`/api/ffxiv/signin/accounts/${deleteAccountId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    showStatus('账号删除成功', 'success');
                    closeDeleteModal();
                    loadAccounts();
                } else {
                    showStatus('删除失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('删除失败: ' + error.message, 'error');
            }
        }

        async function toggleAccountStatus(accountId, enabled) {
            try {
                const response = await fetch(`/api/ffxiv/signin/accounts/${accountId}/toggle`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });

                const result = await response.json();
                if (result.success) {
                    showStatus(enabled ? '账号已启用' : '账号已禁用', 'success');
                    loadAccounts();
                } else {
                    showStatus('操作失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('操作失败: ' + error.message, 'error');
            }
        }

            try {
                showStatus('正在执行签到...', 'info');

                if (result.success) {

                if (result.success) {
                    showStatus(result.message || '奖励领取完成', 'success');

                } else {
                    showStatus('领取失败: ' + result.message, 'error');

        async function checkAllLoginStatus() {
            showStatus('正在检查登录状态...', 'info');
            await loadAccounts(false);
            showStatus('登录状态检查完成', 'success');
        }

        async function setDefaultApiAccount(accountId) {
            try {
                showStatus('正在设置默认API账号...', 'info');
                const response = await fetch(`/api/ffxiv/signin/accounts/${accountId}/set-default-api`, {
                    method: 'POST'
                });

                const result = await response.json();
                if (result.success) {
                    showStatus('默认API账号设置成功', 'success');
                    loadAccounts();
                } else {
                    showStatus('设置失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('设置失败: ' + error.message, 'error');
            }
        }

        function openCharacterDetail(accountId) {
            showStatus('正在加载角色详情...', 'info');
            const account = currentAccounts.find(a => a.accountId === accountId);
            if (!account) {
                showStatus('未找到该账号信息', 'error');
                return;
            }
            
            document.getElementById('characterDetailModal').classList.add('show');
            renderCharacterDetail(account);
        }

        function closeCharacterDetailModal() {
            document.getElementById('characterDetailModal').classList.remove('show');
            showStatus('已关闭角色详情', 'info');
        }

        function renderCharacterDetail(account) {
            const content = document.getElementById('characterDetailContent');
            
            const raceMap = {
                '1': '人族', '2': '精灵族', '3': '猫魅族', '4': '拉拉菲尔族',
                '5': '鲁加族', '6': '敖龙族', '7': '维埃拉族', '8': '硌狮族'
            };
            const tribeMap = {
                '1': '中原之民','2': '高地之民', // 人族
                '3': '森林之民','4': '黑影之民', // 精灵族
                '5': '逐日之民','6': '护月之民', // 猫魅族
                '7': '平原之民','8': '沙漠之民', // 拉拉菲尔族
                '9': '北洋之民','10': '红焰之民', // 鲁加族
                '11': '晨曦之民','12': '暮晖之民', // 敖龙族
                '13': '掠日之民','14': '迷踪之民', // 硌狮族
                '15': '密林之民','16': '山林之民' // 维埃拉族
            };
            const genderMap = {'1': '女', '2': '男'};
            
            let html = `
                <div class="detail-section">
                    <h3>基本信息</h3>
                    <div class="detail-row"><label>角色名</label><value>${account.characterName || '-'}</value></div>
                    <div class="detail-row"><label>服务器</label><value>${account.serverName || '-'}</value></div>
                    <div class="detail-row"><label>性别</label><value>${genderMap[account.gender] || account.gender || '-'}</value></div>
                    <div class="detail-row"><label>种族</label><value>${raceMap[account.race] || account.race || '-'}</value></div>
                    <div class="detail-row"><label>部族</label><value>${tribeMap[account.tribe] || account.tribe || '-'}</value></div>
                    <div class="detail-row"><label>创建时间</label><value>${account.createTime || '-'}</value></div>
                    <div class="detail-row"><label>水晶等级</label><value>${account.crystalRank || '-'}</value></div>
                    <div class="detail-row"><label>军衔</label><value>${account.newrank || '-'}</value></div>
                </div>
                
                <div class="detail-section">
                    <h3>部队信息</h3>
                    <div class="detail-row"><label>部队名称</label><value>${account.guildName || '-'}</value></div>
                    <div class="detail-row"><label>部队标签</label><value>${account.guildTag || '-'}</value></div>
                </div>
                
                <div class="detail-section">
                    <h3>账号信息</h3>
                    <div class="detail-row"><label>账号昵称</label><value>${account.nickname || account.accountId}</value></div>
                    <div class="detail-row"><label>账号ID</label><value>${account.accountId}</value></div>
                </div>
                
                <div class="detail-section">
                    <h3>其他信息</h3>
                    <div class="detail-row"><label>个性签名</label><value>${account.profile || '-'}</value></div>
                    <div class="detail-row"><label>上次登录</label><value>${account.lastLoginTime || '-'}</value></div>
                    <div class="detail-row"><label>房屋信息</label><value>${account.houseInfoPublish === 1 ? '已发布' : (account.houseInfoPublish === 0 ? '未发布' : '-')}</value></div>
                    <div class="detail-row"><label>账号状态</label><value>${account.enabled ? '已启用' : '已禁用'}</value></div>
                    <div class="detail-row"><label>默认API</label><value>${account.defaultForApi ? '是' : '否'}</value></div>
                    <div class="detail-row"><label>上次签到</label><value>${account.lastSignInTime ? new Date(account.lastSignInTime).toLocaleString('zh-CN') : '-'} ${account.lastSignInResult ? '(' + account.lastSignInResult + ')' : ''}</value></div>
                </div>
            `;
            
            content.innerHTML = html;
        }

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                closeModal();
                closeDeleteModal();
                closeCharacterDetailModal();
            }
        });

        document.addEventListener('DOMContentLoaded', loadAccounts);
    </script>
