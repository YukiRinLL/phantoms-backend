<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 Rising Stones 账号管理</title>
    <style>
        :root {
            --primary: #5B6F82;
            --primary-hover: #4A5F72;
            --primary-light: #7A8E9F;
            --primary-bg: rgba(91, 111, 130, 0.08);
            --success: #22A06B;
            --success-bg: rgba(34, 160, 107, 0.1);
            --danger: #C45A5A;
            --danger-bg: rgba(196, 90, 90, 0.1);
            --warning: #C89B4A;
            --warning-bg: rgba(200, 155, 74, 0.1);
            --info-bg: rgba(91, 111, 130, 0.1);
            --bg: #F4F5F7;
            --card-bg: #FFFFFF;
            --text-primary: #2B323B;
            --text-secondary: #606A75;
            --text-muted: #909AA5;
            --border: #E2E5E9;
            --border-hover: #C8CDD3;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 6px 20px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --radius-sm: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .header .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: 12px;
            font-weight: 400;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .toolbar-left {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-input {
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            background-color: var(--card-bg);
            color: var(--text-primary);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            width: 240px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
            background-color: var(--card-bg);
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--bg);
            border-color: var(--border-hover);
        }

        .btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--success);
            color: #fff;
            border-color: var(--success);
        }

        .btn-success:hover:not(:disabled) {
            background-color: #1C8A5A;
            border-color: #1C8A5A;
        }

        .btn-danger {
            background-color: var(--card-bg);
            color: var(--danger);
            border-color: var(--border);
        }

        .btn-danger:hover:not(:disabled) {
            background-color: var(--danger-bg);
            border-color: var(--danger);
        }

        .btn-warning {
            background-color: var(--card-bg);
            color: var(--warning);
            border-color: var(--border);
        }

        .btn-warning:hover:not(:disabled) {
            background-color: var(--warning-bg);
            border-color: var(--warning);
        }

        .btn-sm {
            padding: 5px 11px;
            font-size: 12px;
            border-radius: 5px;
        }

        .btn-ghost {
            background: transparent;
            border-color: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover:not(:disabled) {
            background-color: var(--bg);
            color: var(--text-primary);
        }

        .btn-icon {
            padding: 5px 8px;
            font-size: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
        }

        .btn-icon:hover {
            background-color: var(--bg);
            color: var(--text-primary);
        }

        .stats {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stats strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 16px;
        }

        .account-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .account-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--border-hover);
        }

        .card-header {
            padding: 14px 16px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .card-header-left {
            flex: 1;
            min-width: 0;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .card-subtitle .sep {
            color: var(--text-muted);
        }

        .card-header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.4;
            white-space: nowrap;
        }

        .badge-enabled {
            background-color: var(--success-bg);
            color: var(--success);
        }

        .badge-disabled {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .badge-default {
            background-color: var(--primary-bg);
            color: var(--primary);
        }

        .badge-error {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .badge-login-ok {
            background-color: var(--success-bg);
            color: var(--success);
        }

        .badge-login-err {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .card-body {
            padding: 12px 16px;
        }

        .status-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .status-block {
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
        }

        .status-block-title {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .status-block-head {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 1px 7px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-badge.success {
            background-color: var(--success-bg);
            color: var(--success);
        }

        .status-badge.failed {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .status-badge.error {
            background-color: var(--warning-bg);
            color: var(--warning);
        }

        .status-badge.partial {
            background-color: var(--primary-bg);
            color: var(--primary);
        }

        .status-badge.no-reward {
            background-color: rgba(91, 111, 130, 0.06);
            color: var(--text-secondary);
        }

        .status-badge.pending {
            background-color: var(--warning-bg);
            color: var(--warning);
        }

        .status-badge.disabled {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .status-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .status-detail-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.4;
            word-break: break-all;
        }

        .status-raw-toggle {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: var(--primary);
            cursor: pointer;
            margin-top: 6px;
            user-select: none;
            transition: color 0.15s ease;
        }

        .status-raw-toggle:hover {
            color: var(--primary-hover);
        }

        .status-raw-toggle .arrow {
            display: inline-block;
            transition: transform 0.2s ease;
            font-size: 9px;
        }

        .status-raw-toggle.expanded .arrow {
            transform: rotate(90deg);
        }

        .status-raw-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease;
            margin-top: 0;
        }

        .status-raw-content-inner {
            margin-top: 6px;
            padding: 8px 10px;
            background-color: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-primary);
            max-height: 180px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .card-actions {
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background-color: #FAFBFC;
        }

        .card-actions-left {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .card-actions-right {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 5px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            font-weight: 500;
            white-space: nowrap;
        }

        .action-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background-color: var(--primary-bg);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .action-btn.primary {
            background-color: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .action-btn.primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: #fff;
        }

        .action-btn.success {
            background-color: var(--success-bg);
            color: var(--success);
            border-color: transparent;
        }

        .action-btn.success:hover:not(:disabled) {
            background-color: rgba(34, 160, 107, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .action-btn.danger {
            background-color: transparent;
            color: var(--danger);
            border-color: transparent;
        }

        .action-btn.danger:hover:not(:disabled) {
            background-color: var(--danger-bg);
            border-color: var(--danger);
        }

        .action-btn.api {
            background-color: var(--primary-bg);
            color: var(--primary);
            border-color: transparent;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .empty-state h3 {
            font-size: 16px;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .empty-state p {
            font-size: 13px;
        }

        .status-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 12px 22px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            z-index: 2000;
            min-width: 240px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            box-shadow: var(--shadow-lg);
            border: 1px solid transparent;
        }

        .status-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .status-toast.success {
            background-color: var(--card-bg);
            color: var(--success);
            border-color: var(--success);
        }

        .status-toast.error {
            background-color: var(--card-bg);
            color: var(--danger);
            border-color: var(--danger);
        }

        .status-toast.info {
            background-color: var(--card-bg);
            color: var(--primary);
            border-color: var(--primary);
        }

        .status-toast.warning {
            background-color: var(--card-bg);
            color: var(--warning);
            border-color: var(--warning);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 40, 50, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 1500;
            padding: 20px;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            width: 100%;
            max-width: 460px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            animation: modalIn 0.2s ease;
        }

        .modal-wide {
            max-width: 580px;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border: none;
            background-color: transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .modal-close:hover {
            background-color: var(--bg);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 20px 24px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 14px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background-color: var(--card-bg);
            color: var(--text-primary);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 3px solid var(--primary);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 13px;
            border-bottom: 1px solid var(--bg);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-row-label {
            color: var(--text-secondary);
            font-weight: 500;
            flex-shrink: 0;
        }

        .detail-row-value {
            color: var(--text-primary);
            text-align: right;
            word-break: break-all;
            margin-left: 12px;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 860px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-left,
            .toolbar-right {
                justify-content: flex-start;
            }

            .search-input {
                width: 100%;
            }

            .status-row {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 12px 16px;
            }

            .container {
                padding: 16px;
            }

            .card-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .card-actions-left,
            .card-actions-right {
                justify-content: flex-start;
            }

            .action-btn {
                flex: 1;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }

            .card-header {
                flex-direction: column;
            }

            .card-header-right {
                flex-direction: row;
                align-items: center;
            }

            .batch-actions .btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>FF14 Rising Stones 账号管理</h1>
        <span class="subtitle" id="headerSubtitle"></span>
    </div>

    <div class="container">
        <div id="status" class="status-toast" style="display: none;"></div>

        <div class="toolbar">
            <div class="toolbar-left">
                <button class="btn btn-primary" onclick="manualSignInAll()">全部签到</button>
                <button class="btn btn-success" onclick="manualClaimRewards()">领取奖励</button>
                <button class="btn btn-warning" onclick="checkAllLoginStatus()">检查登录</button>
                <button class="btn" onclick="loadAccounts()">刷新</button>
            </div>
            <div class="toolbar-right">
                <span class="stats" id="statsInfo"></span>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索账号或角色名..." onkeyup="renderTable()">
            </div>
        </div>

        <div class="cards-grid" id="accountsGrid">
            <div class="empty-state" style="grid-column: 1 / -1;">
                <h3>加载中</h3>
                <p>正在获取账号列表...</p>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>编辑账号</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm" onsubmit="handleEditSubmit(event)">
                    <input type="hidden" id="editAccountId">
                    <div class="form-group">
                        <label for="editNickname">账号昵称</label>
                        <input type="text" id="editNickname" placeholder="输入账号昵称">
                    </div>
                    <div class="form-group">
                        <label for="editEnabled">启用状态</label>
                        <select id="editEnabled">
                            <option value="true">已启用</option>
                            <option value="false">已禁用</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="closeModal()">取消</button>
                <button type="submit" class="btn btn-success" onclick="handleEditSubmit(new Event('submit'))">保存</button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>确认删除</h2>
                <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="deleteMessage" style="font-size: 14px; color: var(--text-secondary); line-height: 1.6;"></p>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">此操作不可撤销。</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="closeDeleteModal()">取消</button>
                <button type="button" class="btn btn-danger" onclick="deleteAccount()">删除</button>
            </div>
        </div>
    </div>

    <div id="characterDetailModal" class="modal-overlay">
        <div class="modal modal-wide">
            <div class="modal-header">
                <h2>角色详情</h2>
                <button class="modal-close" onclick="closeCharacterDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="characterDetailContent">
                <div class="empty-state">
                    <div class="loading-spinner" style="margin-bottom: 10px;"></div>
                    <h3>加载中</h3>
                    <p>正在获取角色信息...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAccounts = [];
        let deleteAccountId = null;
        let statusTimer = null;

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status-toast ' + (type || 'info');
            statusDiv.style.display = 'block';
            requestAnimationFrame(() => {
                statusDiv.classList.add('show');
            });
            if (statusTimer) clearTimeout(statusTimer);
            statusTimer = setTimeout(() => {
                statusDiv.classList.remove('show');
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 250);
            }, 2800);
        }

        async function loadAccounts(showLoading) {
            if (showLoading !== false) {
                showStatus('正在加载账号列表...', 'info');
            }
            try {
                const response = await fetch('/api/ffxiv/signin/accounts');
                if (!response.ok) {
                    throw new Error('获取账号列表失败');
                }
                const result = await response.json();
                if (result.success) {
                    currentAccounts = result.data || [];
                    currentAccounts = currentAccounts.filter((account, index, self) =>
                        index === self.findIndex(a => a.accountId === account.accountId)
                    );
                    updateStats();
                    await loadAccountDetails();
                } else {
                    showStatus('获取账号列表失败: ' + result.message, 'error');
                    document.getElementById('accountsGrid').innerHTML =
                        '<div class="empty-state"><h3>加载失败</h3><p>请稍后重试</p></div>';
                }
            } catch (error) {
                showStatus('加载失败: ' + error.message, 'error');
                document.getElementById('accountsGrid').innerHTML =
                    '<div class="empty-state"><h3>加载失败</h3><p>请检查网络连接</p></div>';
            }
        }

        function updateStats() {
            const total = currentAccounts.length;
            const enabled = currentAccounts.filter(a => a.enabled).length;
            document.getElementById('statsInfo').textContent = `共 ${total} 个账号 · 已启用 ${enabled}`;
        }

        async function loadAccountDetails() {
            currentAccounts.forEach(account => {
                account.characterName = '';
                account.serverName = '';
                account.groupName = '';
                account.guildName = '';
                account.houseInfoPublish = -1;
                account.loginError = false;
            });

            const promises = currentAccounts.filter(account => account.enabled).map(async (account) => {
                try {
                    const response = await fetch('/api/ffxiv/signin/accounts/' + account.accountId + '/user-info');
                    const data = await response.json();

                    if (data.success && data.data) {
                        const apiResponse = data.data;
                        if (apiResponse.code === 10000 && apiResponse.data) {
                            const userData = apiResponse.data;
                            account.characterName = userData.character_name || '';
                            account.serverName = userData.group_name || '';
                            account.groupName = userData.group_name || '';
                            account.houseInfoPublish = userData.house_info_publish !== undefined ? userData.house_info_publish : -1;
                            account.profile = userData.profile || '';

                            if (userData.characterDetail) {
                                if (Array.isArray(userData.characterDetail) && userData.characterDetail.length > 0) {
                                    const detail = userData.characterDetail[0];
                                    account.guildName = detail.guild_name || '';
                                    account.guildTag = detail.guild_tag || '';
                                    account.race = detail.race || '';
                                    account.tribe = detail.tribe || '';
                                    account.gender = detail.gender || '';
                                    account.playTime = detail.play_time || '';
                                    account.newrank = detail.newrank || '';
                                    account.crystalRank = detail.crystal_rank || '';
                                    account.createTime = detail.create_time || '';
                                    account.lastLoginTime = detail.last_login_time || '';
                                } else if (typeof userData.characterDetail === 'object') {
                                    const detail = userData.characterDetail;
                                    account.guildName = detail.guild_name || '';
                                    account.guildTag = detail.guild_tag || '';
                                    account.race = detail.race || '';
                                    account.tribe = detail.tribe || '';
                                    account.gender = detail.gender || '';
                                    account.playTime = detail.play_time || '';
                                    account.newrank = detail.newrank || '';
                                    account.crystalRank = detail.crystal_rank || '';
                                    account.createTime = detail.create_time || '';
                                    account.lastLoginTime = detail.last_login_time || '';
                                }
                            }
                        } else if (apiResponse.code === 10105) {
                            account.loginError = true;
                        }
                    }
                } catch (error) {
                    console.log('Failed to load details for account ' + account.accountId + ':', error);
                }
            });

            await Promise.all(promises);
            renderTable();
        }

        function renderTable() {
            const grid = document.getElementById('accountsGrid');
            const searchTerm = (document.getElementById('searchInput').value || '').toLowerCase();

            const filtered = currentAccounts.filter(a =>
                (a.nickname || a.accountId || '').toLowerCase().includes(searchTerm) ||
                (a.characterName || '').toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                const msg = searchTerm ? '未找到匹配的账号' : '暂无账号';
                grid.innerHTML =
                    '<div class="empty-state"><h3>' + msg + '</h3><p>' + (searchTerm ? '尝试其他搜索词' : '请先添加账号') + '</p></div>';
                return;
            }

            let html = '';
            filtered.forEach(function(account) {
                html += renderAccountCard(account);
            });
            grid.innerHTML = html;
        }

        function renderAccountCard(account) {
            const nickname = account.nickname || account.accountId;
            const characterName = account.characterName || '未绑定';
            const serverGuild = (account.serverName || '-') + ' / ' + (account.guildName || account.groupName || '-');
            const isEnabled = account.enabled;
            const isDefault = account.defaultForApi;
            const loginOk = !account.loginError;

            let badgesHtml = '';
            badgesHtml += '<span class="badge ' + (isEnabled ? 'badge-enabled' : 'badge-disabled') + '">' + (isEnabled ? '已启用' : '已禁用') + '</span>';
            if (isDefault) {
                badgesHtml += '<span class="badge badge-default">默认API</span>';
            }
            badgesHtml += '<span class="badge ' + (loginOk ? 'badge-login-ok' : 'badge-login-err') + '">' + (loginOk ? '登录正常' : '登录失效') + '</span>';

            const signInHtml = renderStatusBlock(account, 'signin');
            const rewardHtml = renderStatusBlock(account, 'reward');

            let actionsHtml = '';
            if (isEnabled) {
                actionsHtml += '<button class="action-btn primary" onclick="manualSignIn(\'' + account.accountId + '\')">签到</button>';
                actionsHtml += '<button class="action-btn success" onclick="manualClaimReward(\'' + account.accountId + '\')">领奖励</button>';
                actionsHtml += '<button class="action-btn" onclick="toggleAccountStatus(\'' + account.accountId + '\', false)">禁用</button>';
            } else {
                actionsHtml += '<button class="action-btn success" onclick="toggleAccountStatus(\'' + account.accountId + '\', true)">启用</button>';
                actionsHtml += '<button class="action-btn" disabled>签到</button>';
                actionsHtml += '<button class="action-btn" disabled>领奖励</button>';
            }

            let rightActionsHtml = '';
            rightActionsHtml += '<button class="action-btn" onclick="editAccount(\'' + account.accountId + '\', \'' + escapeJs(nickname) + '\', ' + isEnabled + ')">编辑</button>';
            if (account.characterName) {
                rightActionsHtml += '<button class="action-btn" onclick="openCharacterDetail(\'' + account.accountId + '\')">详情</button>';
            }
            if (isDefault) {
                rightActionsHtml += '<button class="action-btn api" disabled>默认API</button>';
            } else {
                rightActionsHtml += '<button class="action-btn" onclick="setDefaultApiAccount(\'' + account.accountId + '\')">设为API</button>';
            }
            rightActionsHtml += '<button class="action-btn danger" onclick="confirmDeleteAccount(\'' + account.accountId + '\', \'' + escapeJs(nickname) + '\')">删除</button>';

            return '' +
                '<div class="account-card">' +
                    '<div class="card-header">' +
                        '<div class="card-header-left">' +
                            '<div class="card-title-row">' +
                                '<span class="card-title">' + escapeHtml(nickname) + '</span>' +
                            '</div>' +
                            '<div class="card-subtitle">' +
                                '<span>' + escapeHtml(characterName) + '</span>' +
                                '<span class="sep">·</span>' +
                                '<span>' + escapeHtml(serverGuild) + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<div class="card-header-right">' + badgesHtml + '</div>' +
                    '</div>' +
                    '<div class="card-body">' +
                        '<div class="status-row">' + signInHtml + rewardHtml + '</div>' +
                    '</div>' +
                    '<div class="card-actions">' +
                        '<div class="card-actions-left">' + actionsHtml + '</div>' +
                        '<div class="card-actions-right">' + rightActionsHtml + '</div>' +
                    '</div>' +
                '</div>';
        }

        function renderStatusBlock(account, type) {
            if (!account.enabled) {
                return '<div class="status-block">' +
                    '<div class="status-block-title">' + (type === 'signin' ? '签到' : '奖励') + '</div>' +
                    '<div class="status-block-head"><span class="status-badge disabled">已禁用</span></div>' +
                '</div>';
            }

            if (type === 'signin') {
                const status = account.lastSignInStatus;
                const time = account.lastSignInTime;
                const detail = account.lastSignInDetail;
                const rawResponse = account.lastSignInRawResponse;
                return buildStatusBlock('签到', status, time, detail, rawResponse);
            } else {
                const status = account.lastRewardStatus;
                const time = account.lastRewardTime;
                const detail = account.lastRewardDetail;
                const rawResponse = account.lastRewardRawResponse;
                return buildStatusBlock('奖励', status, time, detail, rawResponse);
            }
        }

        function buildStatusBlock(label, status, time, detail, rawResponse) {
            if (!time) {
                const pendingText = label === '签到' ? '未签到' : '未领取';
                return '<div class="status-block">' +
                    '<div class="status-block-title">' + label + '</div>' +
                    '<div class="status-block-head"><span class="status-badge pending">' + pendingText + '</span></div>' +
                '</div>';
            }

            let badgeClass = 'pending';
            let badgeText = '未知';

            if (label === '签到') {
                if (status === 'SUCCESS') { badgeClass = 'success'; badgeText = '签到成功'; }
                else if (status === 'FAILED') { badgeClass = 'failed'; badgeText = '签到失败'; }
                else if (status === 'ERROR') { badgeClass = 'error'; badgeText = '签到异常'; }
                else if (status) { badgeText = status; }
            } else {
                if (status === 'SUCCESS') { badgeClass = 'success'; badgeText = '领取成功'; }
                else if (status === 'PARTIAL') { badgeClass = 'partial'; badgeText = '部分成功'; }
                else if (status === 'FAILED') { badgeClass = 'failed'; badgeText = '领取失败'; }
                else if (status === 'ERROR') { badgeClass = 'error'; badgeText = '领取异常'; }
                else if (status === 'NO_REWARD') { badgeClass = 'no-reward'; badgeText = '暂无可用'; }
                else if (status) { badgeText = status; }
            }

            let html = '<div class="status-block">' +
                '<div class="status-block-title">' + label + '</div>' +
                '<div class="status-block-head">' +
                    '<span class="status-badge ' + badgeClass + '">' + badgeText + '</span>' +
                    '<span class="status-time">' + formatTime(time) + '</span>' +
                '</div>';
            if (detail) {
                html += '<div class="status-detail-text" title="' + escapeHtml(detail) + '">' + escapeHtml(detail) + '</div>';
            }
            if (rawResponse) {
                const toggleId = 'raw-' + Math.random().toString(36).substr(2, 9);
                html += '<div class="status-raw-toggle" onclick="toggleRawResponse(this, \'' + toggleId + '\')">' +
                    '<span class="arrow">▸</span> 查看原始响应</div>' +
                    '<div class="status-raw-content" id="' + toggleId + '">' +
                        '<div class="status-raw-content-inner">' + escapeHtml(rawResponse) + '</div>' +
                    '</div>';
            }
            html += '</div>';
            return html;
        }

        function toggleRawResponse(element, contentId) {
            const content = document.getElementById(contentId);
            if (!content) return;
            const isExpanded = content.classList.contains('show');
            if (isExpanded) {
                content.style.maxHeight = '0';
                content.classList.remove('show');
                element.classList.remove('expanded');
                element.innerHTML = '<span class="arrow">▸</span> 查看原始响应';
            } else {
                content.classList.add('show');
                content.style.maxHeight = '300px';
                element.classList.add('expanded');
                element.innerHTML = '<span class="arrow">▾</span> 收起原始响应';
            }
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMin = Math.floor(diffMs / 60000);
            const diffHour = Math.floor(diffMs / 3600000);
            const diffDay = Math.floor(diffMs / 86400000);
            if (diffMin < 1) return '刚刚';
            if (diffMin < 60) return diffMin + ' 分钟前';
            if (diffHour < 24) return diffHour + ' 小时前';
            if (diffDay < 7) return diffDay + ' 天前';
            return date.toLocaleString('zh-CN', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeJs(text) {
            if (!text) return '';
            return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function editAccount(accountId, nickname, enabled) {
            document.getElementById('editAccountId').value = accountId;
            document.getElementById('editNickname').value = nickname;
            document.getElementById('editEnabled').value = enabled ? 'true' : 'false';
            document.getElementById('editModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        async function handleEditSubmit(event) {
            if (event && event.preventDefault) {
                event.preventDefault();
            }

            const accountId = document.getElementById('editAccountId').value;
            const nickname = document.getElementById('editNickname').value.trim();
            const enabled = document.getElementById('editEnabled').value === 'true';

            try {
                const response = await fetch('/api/ffxiv/signin/accounts/' + accountId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname: nickname, enabled: enabled })
                });

                const result = await response.json();
                if (result.success) {
                    showStatus('账号更新成功', 'success');
                    closeModal();
                    loadAccounts(false);
                } else {
                    showStatus('更新失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('更新失败: ' + error.message, 'error');
            }
        }

        function confirmDeleteAccount(accountId, nickname) {
            deleteAccountId = accountId;
            document.getElementById('deleteMessage').textContent = '确定要删除账号 "' + nickname + '" 吗？此操作不可撤销。';
            document.getElementById('deleteModal').classList.add('show');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
            deleteAccountId = null;
        }

        async function deleteAccount() {
            if (!deleteAccountId) return;

            try {
                const response = await fetch('/api/ffxiv/signin/accounts/' + deleteAccountId, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    showStatus('账号删除成功', 'success');
                    closeDeleteModal();
                    loadAccounts(false);
                } else {
                    showStatus('删除失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('删除失败: ' + error.message, 'error');
            }
        }

        async function toggleAccountStatus(accountId, enabled) {
            try {
                const response = await fetch('/api/ffxiv/signin/accounts/' + accountId + '/toggle', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: enabled })
                });

                const result = await response.json();
                if (result.success) {
                    showStatus(enabled ? '账号已启用' : '账号已禁用', 'success');
                    loadAccounts(false);
                } else {
                    showStatus('操作失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('操作失败: ' + error.message, 'error');
            }
        }

        async function manualSignIn(accountId) {
            const account = currentAccounts.find(function(a) { return a.accountId === accountId; });
            if (!account) return;

            showStatus('正在为 ' + (account.nickname || account.accountId) + ' 执行签到...', 'info');

            try {
                const response = await fetch('/api/ffxiv/signin/manual-signin/' + accountId, {
                    method: 'POST'
                });
                const result = await response.json();
                if (result.success) {
                    showStatus(result.message || (account.nickname || account.accountId) + ' 签到成功', 'success');
                    loadAccounts(false);
                } else {
                    showStatus((account.nickname || account.accountId) + ' 签到失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus((account.nickname || account.accountId) + ' 签到失败: ' + error.message, 'error');
            }
        }

        async function manualClaimReward(accountId) {
            const account = currentAccounts.find(function(a) { return a.accountId === accountId; });
            if (!account) return;

            showStatus('正在为 ' + (account.nickname || account.accountId) + ' 领取奖励...', 'info');

            try {
                const response = await fetch('/api/ffxiv/signin/manual-claim-rewards/' + accountId, {
                    method: 'POST'
                });
                const result = await response.json();
                if (result.success) {
                    showStatus(result.message || (account.nickname || account.accountId) + ' 奖励领取成功', 'success');
                    loadAccounts(false);
                } else {
                    showStatus((account.nickname || account.accountId) + ' 奖励领取失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus((account.nickname || account.accountId) + ' 奖励领取失败: ' + error.message, 'error');
            }
        }

        async function manualSignInAll() {
            const enabledCount = currentAccounts.filter(function(a) { return a.enabled; }).length;
            showStatus('正在执行全部签到，请稍候（共 ' + enabledCount + ' 个账号）...', 'info');

            try {
                const response = await fetch('/api/ffxiv/signin/manual-signin', {
                    method: 'POST'
                });
                const result = await response.json();
                if (result.success) {
                    showStatus(result.message || '全部签到完成（' + enabledCount + ' 个账号）', 'success');
                    loadAccounts(false);
                } else {
                    showStatus('全部签到失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('全部签到失败: ' + error.message, 'error');
            }
        }

        async function manualClaimRewards() {
            const enabledCount = currentAccounts.filter(function(a) { return a.enabled; }).length;
            showStatus('正在领取奖励，请稍候（共 ' + enabledCount + ' 个账号）...', 'info');

            try {
                const response = await fetch('/api/ffxiv/signin/manual-claim-rewards', {
                    method: 'POST'
                });
                const result = await response.json();
                if (result.success) {
                    showStatus(result.message || '奖励领取完成（' + enabledCount + ' 个账号）', 'success');
                    loadAccounts(false);
                } else {
                    showStatus('奖励领取失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('奖励领取失败: ' + error.message, 'error');
            }
        }

        async function checkAllLoginStatus() {
            showStatus('正在检查登录状态，请稍候...', 'info');
            await loadAccounts(false);
            showStatus('登录状态检查完成', 'success');
        }

        async function setDefaultApiAccount(accountId) {
            try {
                showStatus('正在设置默认API账号...', 'info');
                const response = await fetch('/api/ffxiv/signin/accounts/' + accountId + '/set-default-api', {
                    method: 'POST'
                });

                const result = await response.json();
                if (result.success) {
                    showStatus('默认API账号设置成功', 'success');
                    loadAccounts(false);
                } else {
                    showStatus('设置失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('设置失败: ' + error.message, 'error');
            }
        }

        async function openCharacterDetail(accountId) {
            showStatus('正在加载角色详情...', 'info');
            const account = currentAccounts.find(function(a) { return a.accountId === accountId; });
            if (!account) {
                showStatus('未找到该账号信息', 'error');
                return;
            }

            document.getElementById('characterDetailModal').classList.add('show');
            renderCharacterDetail(account, true);

            try {
                const response = await fetch('/api/ffxiv/signin/accounts/' + accountId + '/user-info');
                const result = await response.json();

                if (result.success && result.data) {
                    const userData = result.data.data || result.data;

                    account.characterName = userData.character_name || account.characterName;
                    account.serverName = userData.group_name || account.serverName;
                    account.groupName = userData.group_name || account.groupName;
                    account.houseInfoPublish = userData.house_info_publish !== undefined ? userData.house_info_publish : account.houseInfoPublish;
                    account.profile = userData.profile || account.profile;

                    if (userData.characterDetail) {
                        let detail = userData.characterDetail;
                        if (typeof detail === 'string') {
                            try {
                                detail = JSON.parse(detail);
                            } catch (e) {
                                console.log('无法解析characterDetail:', detail);
                                detail = null;
                            }
                        }
                        if (detail && Array.isArray(detail)) {
                            detail = detail[0];
                        }
                        if (detail && typeof detail === 'object') {
                            account.guildName = detail.guild_name || account.guildName;
                            account.guildTag = detail.guild_tag || account.guildTag;
                            account.race = detail.race || account.race;
                            account.tribe = detail.tribe || account.tribe;
                            account.gender = detail.gender || account.gender;
                            account.playTime = detail.play_time || account.playTime;
                            account.newrank = detail.newrank || account.newrank;
                            account.crystalRank = detail.crystal_rank || account.crystalRank;
                            account.createTime = detail.create_time || account.create_time;
                            account.lastLoginTime = detail.last_login_time || account.lastLoginTime;
                        }
                    }

                    renderCharacterDetail(account, false);
                    showStatus('角色详情已更新', 'success');
                } else {
                    showStatus('获取角色详情失败: ' + (result.message || '未知错误'), 'error');
                }
            } catch (error) {
                showStatus('获取角色详情失败: ' + error.message, 'error');
            }
        }

        function closeCharacterDetailModal() {
            document.getElementById('characterDetailModal').classList.remove('show');
        }

        function renderCharacterDetail(account, isLoading) {
            const content = document.getElementById('characterDetailContent');

            if (isLoading) {
                content.innerHTML = '<div class="empty-state"><div class="loading-spinner" style="margin-bottom: 10px;"></div><h3>加载中</h3><p>正在获取角色信息...</p></div>';
                return;
            }

            const raceMap = {
                '1': '人族', '2': '精灵族', '3': '猫魅族', '4': '拉拉菲尔族',
                '5': '鲁加族', '6': '敖龙族', '7': '维埃拉族', '8': '硌狮族'
            };
            const tribeMap = {
                '1': '中原之民','2': '高地之民',
                '3': '森林之民','4': '黑影之民',
                '5': '逐日之民','6': '护月之民',
                '7': '平原之民','8': '沙漠之民',
                '9': '北洋之民','10': '红焰之民',
                '11': '晨曦之民','12': '暮晖之民',
                '13': '掠日之民','14': '迷踪之民',
                '15': '密林之民','16': '山林之民'
            };
            const genderMap = { '1': '女', '2': '男' };

            const formatDetailText = function(detail) {
                if (!detail) return '-';
                return detail.length > 50 ? detail.substring(0, 50) + '...' : detail;
            };

            let html = '';

            html += '<div class="detail-section">';
            html += '<div class="detail-section-title">基本信息</div>';
            html += detailRow('角色名', account.characterName || '-');
            html += detailRow('服务器', account.serverName || '-');
            html += detailRow('性别', genderMap[account.gender] || account.gender || '-');
            html += detailRow('种族', raceMap[account.race] || account.race || '-');
            html += detailRow('部族', tribeMap[account.tribe] || account.tribe || '-');
            html += detailRow('创建时间', account.createTime || '-');
            html += detailRow('水晶等级', account.crystalRank || '-');
            html += detailRow('军衔', account.newrank || '-');
            html += '</div>';

            html += '<div class="detail-section">';
            html += '<div class="detail-section-title">部队信息</div>';
            html += detailRow('部队名称', account.guildName || '-');
            html += detailRow('部队标签', account.guildTag || '-');
            html += '</div>';

            html += '<div class="detail-section">';
            html += '<div class="detail-section-title">账号信息</div>';
            html += detailRow('账号昵称', account.nickname || account.accountId);
            html += detailRow('账号ID', account.accountId);
            html += '</div>';

            html += '<div class="detail-section">';
            html += '<div class="detail-section-title">签到状态</div>';
            html += detailRow('签到状态', account.lastSignInStatus || '未知');
            html += detailRow('签到时间', account.lastSignInTime ? new Date(account.lastSignInTime).toLocaleString('zh-CN') : '-');
            html += detailRow('签到详情', formatDetailText(account.lastSignInDetail));
            if (account.lastSignInRawResponse) {
                html += '<div class="detail-row"><span class="detail-row-label">原始响应</span><span class="detail-row-value" style="max-height:120px;overflow:auto;white-space:pre-wrap;font-size:11px;max-width:60%;" title="' + escapeHtml(account.lastSignInRawResponse) + '">' + escapeHtml(account.lastSignInRawResponse.substring(0, Math.min(300, account.lastSignInRawResponse.length))) + (account.lastSignInRawResponse.length > 300 ? '...' : '') + '</span></div>';
            }
            html += '</div>';

            html += '<div class="detail-section">';
            html += '<div class="detail-section-title">奖励状态</div>';
            html += detailRow('奖励状态', account.lastRewardStatus || '未知');
            html += detailRow('领取时间', account.lastRewardTime ? new Date(account.lastRewardTime).toLocaleString('zh-CN') : '-');
            html += detailRow('奖励详情', formatDetailText(account.lastRewardDetail));
            if (account.lastRewardRawResponse) {
                html += '<div class="detail-row"><span class="detail-row-label">原始响应</span><span class="detail-row-value" style="max-height:120px;overflow:auto;white-space:pre-wrap;font-size:11px;max-width:60%;" title="' + escapeHtml(account.lastRewardRawResponse) + '">' + escapeHtml(account.lastRewardRawResponse.substring(0, Math.min(300, account.lastRewardRawResponse.length))) + (account.lastRewardRawResponse.length > 300 ? '...' : '') + '</span></div>';
            }
            html += '</div>';

            html += '<div class="detail-section">';
            html += '<div class="detail-section-title">其他信息</div>';
            html += detailRow('个性签名', account.profile || '-');
            html += detailRow('上次登录', account.lastLoginTime || '-');
            html += detailRow('房屋信息', account.houseInfoPublish === 1 ? '已发布' : (account.houseInfoPublish === 0 ? '未发布' : '-'));
            html += detailRow('账号状态', account.enabled ? '已启用' : '已禁用');
            html += detailRow('默认API', account.defaultForApi ? '是' : '否');
            html += '</div>';

            content.innerHTML = html;
        }

        function detailRow(label, value) {
            return '<div class="detail-row"><span class="detail-row-label">' + label + '</span><span class="detail-row-value">' + escapeHtml(value) + '</span></div>';
        }

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                closeModal();
                closeDeleteModal();
                closeCharacterDetailModal();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            loadAccounts();
        });
    </script>
</body>
</html>
