<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号列表</title>
    <style>
        :root {
            --primary: #6B7B8A;
            --primary-light: #8A9BA8;
            --success: #7BAF7B;
            --danger: #C47B7B;
            --warning: #D4B87A;
            --bg: #F5F6F7;
            --card-bg: #FFFFFF;
            --text-primary: #3D454D;
            --text-secondary: #6B7B8A;
            --border: #E8EAEB;
            --shadow: 0 2px 8px rgba(107, 123, 138, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }
        
        .header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(107, 123, 138, 0.2);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .search-bar input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--bg);
            color: var(--text-primary);
            transition: border-color 0.2s ease;
        }
        
        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .accounts-table {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .table-header {
            display: grid;
            grid-template-columns: 30px 140px 120px 140px 100px 150px 130px 100px 80px;
            background-color: var(--bg);
            padding: 4px 12px;
            font-weight: 600;
            font-size: 11px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }
        
        .table-row {
            display: grid;
            grid-template-columns: 30px 140px 120px 140px 100px 150px 130px 100px 80px;
            padding: 4px 12px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        
        .table-row:hover {
            background-color: rgba(107, 123, 138, 0.03);
        }
        
        .table-row:last-child {
            border-bottom: none;
        }
        
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge.enabled {
            background-color: rgba(123, 175, 123, 0.15);
            color: var(--success);
        }
        
        .badge.disabled {
            background-color: rgba(196, 123, 123, 0.15);
            color: var(--danger);
        }
        
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-secondary);
        }
        
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background-color: var(--bg);
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .modal-close:hover {
            background-color: var(--border);
            color: var(--text-primary);
        }
        
        .detail-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .detail-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .detail-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            padding-left: 8px;
            border-left: 3px solid var(--primary);
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }
        
        .detail-row label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .detail-row value {
            color: var(--text-primary);
            font-weight: 400;
        }
        
        .status {
            margin: 15px 0;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status.success {
            background-color: rgba(123, 175, 123, 0.1);
            color: var(--success);
            border: 1px solid rgba(123, 175, 123, 0.2);
        }
        
        .status.error {
            background-color: rgba(196, 123, 123, 0.1);
            color: var(--danger);
            border: 1px solid rgba(196, 123, 123, 0.2);
        }
        
        .status.info {
            background-color: rgba(107, 123, 138, 0.1);
            color: var(--text-secondary);
            border: 1px solid rgba(107, 123, 138, 0.2);
        }
        
        @media (max-width: 768px) {
            .table-header {
                display: none;
            }
            
            .table-row {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 12px;
                border-bottom: 1px solid var(--border);
            }
            
            .table-row > div {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .table-row > div::before {
                content: attr(data-label);
                font-weight: 500;
                color: var(--text-secondary);
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>账号列表</h1>
        <button class="btn btn-primary" onclick="goBack()">返回登录</button>
    </div>

    <div class="container">
        <div id="statusMessage" class="status" style="display: none;"></div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索账号或角色名..." onkeyup="filterTable()">
            <button class="btn btn-primary" onclick="loadAccounts()">刷新</button>
        </div>

        <div class="accounts-table">
            <div class="table-header">
                <div>#</div>
                <div>账号信息</div>
                <div>角色名</div>
                <div>服务器/部队</div>
                <div>房屋信息</div>
                <div>个性签名</div>
                <div>上次登录</div>
                <div>状态</div>
                <div>操作</div>
            </div>
            <div id="accountsTable">
                <div class="table-row">
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="characterDetailModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">角色详情</h2>
                <button class="modal-close" onclick="closeCharacterDetailModal()">×</button>
            </div>
            <div id="characterDetailContent">
                <div class="empty-state">
                    <h3>加载中...</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        let accounts = [];

        function showStatus(message, type) {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        function goBack() {
            window.location.href = 'login.html';
        }

        async function loadAccounts() {
            try {
                const response = await fetch('/api/ffxiv/signin/accounts');
                if (!response.ok) {
                    throw new Error('获取账号列表失败');
                }
                const result = await response.json();
                if (result.success) {
                    accounts = result.data || [];
                    await loadAccountDetails();
                } else {
                    showStatus('获取账号列表失败: ' + result.message, 'error');
                    document.getElementById('accountsTable').innerHTML = 
                        '<div class="table-row"><div style="grid-column: 1 / -1; text-align: center; padding: 40px;">加载失败</div></div>';
                }
            } catch (error) {
                showStatus('加载失败: ' + error.message, 'error');
                document.getElementById('accountsTable').innerHTML = 
                    '<div class="table-row"><div style="grid-column: 1 / -1; text-align: center; padding: 40px;">加载失败，请检查网络连接</div></div>';
            }
        }

        async function loadAccountDetails() {
            for (const account of accounts) {
                account.characterName = '';
                account.serverName = '';
                account.groupName = '';
                account.guildName = '';
                account.houseInfoPublish = -1;
                account.loginError = false;
                account.profile = '';
                account.lastLoginTime = 0;

                if (!account.enabled) continue;

                try {
                    const response = await fetch(`/api/ffxiv/signin/accounts/${account.accountId}/user-info`);
                    const data = await response.json();
                    
                    if (data.success && data.data) {
                        const userData = data.data;
                        account.characterName = userData.character_name || '';
                        account.serverName = userData.area_name || '';
                        account.groupName = userData.group_name || '';
                        account.profile = userData.profile || '';
                        
                        if (userData.characterDetail) {
                            account.guildName = userData.characterDetail.guild_name || '';
                            account.houseInfoPublish = userData.characterDetail.house_info_publish || -1;
                        }
                        
                        account.lastLoginTime = userData.last_login_time || 0;
                    } else if (data.code === 10105) {
                        account.loginError = true;
                    }
                } catch (error) {
                    console.log(`Failed to load details for account ${account.accountId}:`, error);
                }
            }
            renderTable();
        }

        function renderTable() {
            const table = document.getElementById('accountsTable');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = accounts.filter(a => 
                (a.nickname || a.accountId).toLowerCase().includes(searchTerm) ||
                a.characterName.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                table.innerHTML = '<div class="table-row"><div style="grid-column: 1 / -1; text-align: center; padding: 40px;">暂无数据</div></div>';
                return;
            }

            let html = '';
            filtered.forEach((account, index) => {
                html += `
                    <div class="table-row" onclick="openCharacterDetail('${account.accountId}')">
                        <div data-label="#">${index + 1}</div>
                        <div data-label="账号信息">
                            <div style="font-weight: 500; color: var(--text-primary); font-size: 13px;">${account.nickname || account.accountId}</div>
                            <div style="font-size: 11px; color: var(--text-secondary);">${account.accountId}</div>
                        </div>
                        <div data-label="角色名">
                            ${account.loginError ? '<span style="font-size: 11px; color: var(--danger);">⚠️ 登录失效</span>' : account.characterName ? `<span style="font-weight: 500; font-size: 13px;">${account.characterName}</span>` : '<span style="color: var(--text-secondary); font-size: 11px;">未绑定</span>'}
                        </div>
                        <div data-label="服务器/部队">
                            <div style="font-size: 12px;">${account.serverName || '-'}</div>
                            <div style="font-size: 11px; color: var(--text-secondary);">${account.guildName || account.groupName || '-'}</div>
                        </div>
                        <div data-label="房屋信息">
                            <span style="font-size: 11px;">${account.houseInfoPublish === 1 ? '已发布' : (account.houseInfoPublish === 0 ? '未发布' : '-')}</span>
                        </div>
                        <div data-label="个性签名">
                            <span style="font-size: 11px; color: var(--text-secondary);">${account.profile || '-'}</span>
                        </div>
                        <div data-label="上次登录">
                            <span style="font-size: 11px;">${account.lastLoginTime ? formatTime(account.lastLoginTime) : '-'}</span>
                        </div>
                        <div data-label="状态">
                            <span class="badge ${account.enabled ? 'enabled' : 'disabled'}">${account.enabled ? '已启用' : '已禁用'}</span>
                        </div>
                        <div data-label="操作">
                            <button class="btn btn-primary" style="padding: 4px 10px; font-size: 11px;">详情</button>
                        </div>
                    </div>
                `;
            });
            table.innerHTML = html;
        }

        function filterTable() {
            renderTable();
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function openCharacterDetail(accountId) {
            showStatus('正在加载角色详情...', 'info');
            const account = accounts.find(a => a.accountId === accountId);
            if (!account) return;
            
            document.getElementById('characterDetailModal').classList.add('show');
            renderCharacterDetail(account);
        }

        function closeCharacterDetailModal() {
            document.getElementById('characterDetailModal').classList.remove('show');
            showStatus('已关闭角色详情', 'info');
        }

        function renderCharacterDetail(account) {
            const content = document.getElementById('characterDetailContent');
            
            let html = `
                <div class="detail-section">
                    <h3>基本信息</h3>
                    <div class="detail-row"><label>账号昵称</label><value>${account.nickname || account.accountId}</value></div>
                    <div class="detail-row"><label>账号ID</label><value>${account.accountId}</value></div>
                    <div class="detail-row"><label>角色名</label><value>${account.characterName || '-'}</value></div>
                    <div class="detail-row"><label>服务器</label><value>${account.serverName || '-'}</value></div>
                </div>
                
                <div class="detail-section">
                    <h3>部队信息</h3>
                    <div class="detail-row"><label>部队名称</label><value>${account.guildName || account.groupName || '-'}</value></div>
                </div>
                
                <div class="detail-section">
                    <h3>其他信息</h3>
                    <div class="detail-row"><label>个性签名</label><value>${account.profile || '-'}</value></div>
                    <div class="detail-row"><label>房屋信息</label><value>${account.houseInfoPublish === 1 ? '已发布' : (account.houseInfoPublish === 0 ? '未发布' : '-')}</value></div>
                    <div class="detail-row"><label>上次登录</label><value>${account.lastLoginTime ? new Date(account.lastLoginTime).toLocaleString('zh-CN') : '-'}</value></div>
                    <div class="detail-row"><label>账号状态</label><value>${account.enabled ? '已启用' : '已禁用'}</value></div>
                </div>
            `;
            
            content.innerHTML = html;
        }

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                closeCharacterDetailModal();
            }
        });

        document.addEventListener('DOMContentLoaded', loadAccounts);
    </script>
</body>
</html>
