<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 Rising Stones 账号概览</title>
    <style>
        :root {
            --primary: #6B7B8A;
            --primary-light: #8A9BA8;
            --success: #7BAF7B;
            --danger: #C47B7B;
            --warning: #D4B87A;
            --bg: #F5F6F7;
            --card-bg: #FFFFFF;
            --text-primary: #3D454D;
            --text-secondary: #6B7B8A;
            --border: #E8EAEB;
            --shadow: 0 2px 8px rgba(107, 123, 138, 0.08);
            --shadow-hover: 0 4px 16px rgba(107, 123, 138, 0.12);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }
        
        .header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        
        .header .back-link {
            padding: 8px 16px;
            background-color: var(--bg);
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .header .back-link:hover {
            background-color: var(--border);
            color: var(--text-primary);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .stat-card .number {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }
        
        .stat-card .label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        
        .stat-card.success .number { color: var(--success); }
        .stat-card.danger .number { color: var(--danger); }
        .stat-card.warning .number { color: var(--warning); }
        
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .search-bar input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--card-bg);
            color: var(--text-primary);
            transition: border-color 0.2s ease;
        }
        
        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .accounts-table {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .table-header {
            display: grid;
            grid-template-columns: 30px 140px 120px 140px 100px 150px 130px 100px 80px;
            background-color: var(--bg);
            padding: 4px 12px;
            font-weight: 600;
            font-size: 11px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }
        
        .table-row {
            display: grid;
            grid-template-columns: 30px 140px 120px 140px 100px 150px 130px 100px 80px;
            padding: 4px 12px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        
        .table-row:hover {
            background-color: rgba(107, 123, 138, 0.03);
        }
        
        .table-row:last-child {
            border-bottom: none;
        }
        
        .table-row.disabled {
            opacity: 0.6;
        }
        
        .table-row.login-error {
            background-color: rgba(196, 123, 123, 0.05);
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin: 0 auto;
        }
        
        .status-dot.enabled { background-color: var(--success); }
        .status-dot.disabled { background-color: var(--danger); }
        .status-dot.error { background-color: var(--warning); }
        
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge.enabled { background-color: rgba(123, 175, 123, 0.15); color: var(--success); }
        .badge.disabled { background-color: rgba(196, 123, 123, 0.15); color: var(--danger); }
        .badge.api { background-color: rgba(107, 123, 138, 0.15); color: var(--primary); }
        
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-secondary);
        }
        
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .character-detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .character-detail-modal.show {
            display: flex;
        }
        
        .modal-content {
            background-color: var(--card-bg);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background-color: var(--bg);
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .modal-close:hover {
            background-color: var(--border);
            color: var(--text-primary);
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .detail-section {
            margin-bottom: 24px;
        }
        
        .detail-section:last-child {
            margin-bottom: 0;
        }
        
        .detail-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(107, 123, 138, 0.05);
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .detail-value {
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .error-box {
            background-color: rgba(196, 123, 123, 0.08);
            border-left: 3px solid var(--danger);
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 0 6px 6px 0;
        }
        
        .error-box p {
            color: var(--danger);
            font-size: 13px;
            margin: 0;
        }
        
        .error-box a {
            color: var(--danger);
            text-decoration: none;
            font-weight: 500;
        }
        
        .error-box a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .table-header {
                display: none;
            }
            
            .table-row {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 16px;
                border-bottom: 1px solid var(--border);
            }
            
            .table-row > div {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .table-row > div::before {
                content: attr(data-label);
                font-weight: 500;
                color: var(--text-secondary);
                font-size: 12px;
            }
            
            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>FF14 Rising Stones 账号概览</h1>
        <a href="login.html" class="back-link">返回登录</a>
    </div>
    
    <div class="container">
        <div class="stats-bar" id="statsBar" style="display:none;">
            <div class="stat-card">
                <div class="number" id="totalCount">0</div>
                <div class="label">总账号数</div>
            </div>
            <div class="stat-card success">
                <div class="number" id="enabledCount">0</div>
                <div class="label">已启用</div>
            </div>
            <div class="stat-card danger">
                <div class="number" id="disabledCount">0</div>
                <div class="label">已禁用</div>
            </div>
            <div class="stat-card warning">
                <div class="number" id="characterCount">0</div>
                <div class="label">已绑定角色</div>
            </div>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索昵称、角色名、服务器..." oninput="filterAccounts()">
        </div>
        
        <div class="accounts-table" id="accountsTable">
            <div class="loading">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>
    
    <div class="character-detail-modal" id="characterDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>角色详情</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </div>
    
    <script>
        const baseUrl = '';
        let currentAccounts = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadAccounts();
        });
        
        async function loadAccounts() {
            try {
                const response = await fetch(`${baseUrl}/api/ffxiv/signin/accounts`);
                const data = await response.json();
                
                if (data.success) {
                    currentAccounts = data.data;
                    await checkAllAccountStatus(currentAccounts);
                    renderAccounts(currentAccounts);
                    updateStats(currentAccounts);
                } else {
                    document.getElementById('accountsTable').innerHTML = `
                        <div class="empty-state">
                            <h3>加载失败</h3>
                            <p>${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('accountsTable').innerHTML = `
                    <div class="empty-state">
                        <h3>加载失败</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function checkAllAccountStatus(accounts) {
            for (const account of accounts) {
                try {
                    const response = await fetch(`${baseUrl}/api/ffxiv/signin/character/bind-info/${account.accountId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({})
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        const bindInfo = data.data;
                        if (bindInfo.code === 10105) {
                            account.loginError = bindInfo.msg;
                        } else if (bindInfo.code === 10000) {
                            const userData = bindInfo.data || {};
                            account.characterName = userData.character_name || '';
                            account.serverName = userData.area_name || '';
                            account.groupName = userData.group_name || '';
                            account.avatar = userData.avatar || '';
                            account.houseInfoPublish = userData.house_info_publish || 0;
                            account.uuid = userData.uuid || '';
                            account.lastLoginTime = userData.last_login_time || '';
                            account.guildName = userData.characterDetail ? userData.characterDetail.guild_name : '';
                            account.guildTag = userData.characterDetail ? userData.characterDetail.guild_tag : '';
                            account.profile = userData.profile || '';
                        }
                    }
                } catch (error) {
                    console.warn(`检查账号 ${account.accountId} 状态失败:`, error);
                }
            }
        }
        
        function renderAccounts(accounts) {
            const table = document.getElementById('accountsTable');
            
            if (!accounts || accounts.length === 0) {
                table.innerHTML = `
                    <div class="empty-state">
                        <h3>暂无账号</h3>
                        <p>请前往登录页面添加新账号</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="table-header">';
            html += '<div></div>';
            html += '<div>账号信息</div>';
            html += '<div>角色名</div>';
            html += '<div>服务器 / 部队</div>';
            html += '<div>房屋信息</div>';
            html += '<div>个性签名</div>';
            html += '<div>上次登录</div>';
            html += '<div>状态</div>';
            html += '<div>操作</div>';
            html += '</div>';
            
            html += accounts.map(account => `
                <div class="table-row ${account.enabled ? '' : 'disabled'} ${account.loginError ? 'login-error' : ''}" onclick="openModal('${account.accountId}')">
                    <div data-label="状态"><div class="status-dot ${account.loginError ? 'error' : account.enabled ? 'enabled' : 'disabled'}"></div></div>
                    <div data-label="账号信息">
                        <div style="font-weight: 500; color: var(--text-primary); font-size: 13px;">${account.nickname || account.accountId}</div>
                        <div style="font-size: 11px; color: var(--text-secondary);">${account.accountId}</div>
                    </div>
                    <div data-label="角色名">
                        ${account.characterName ? `<span style="font-weight: 500; font-size: 13px;">${account.characterName}</span>` : '<span style="color: var(--text-secondary); font-size: 11px;">未绑定</span>'}
                    </div>
                    <div data-label="服务器/部队">
                        <div style="font-size: 12px;">${account.serverName || '-'}</div>
                        <div style="font-size: 11px; color: var(--text-secondary);">${account.guildName || account.groupName || '-'}</div>
                    </div>
                    <div data-label="房屋信息">
                        <span style="font-size: 11px;">${account.houseInfoPublish === 1 ? '已发布' : (account.houseInfoPublish === 0 ? '未发布' : '-')}</span>
                    </div>
                    <div data-label="个性签名">
                        <span style="font-size: 11px; color: var(--text-secondary);">${account.profile || '-'}</span>
                    </div>
                    <div data-label="上次登录">
                        <span style="font-size: 11px;">${account.lastLoginTime ? formatTime(account.lastLoginTime) : '-'}</span>
                    </div>
                    <div data-label="状态">
                        <span class="badge ${account.enabled ? 'enabled' : 'disabled'}">${account.enabled ? '已启用' : '已禁用'}</span>
                    </div>
                    <div data-label="操作">
                        <span style="color: var(--primary); font-size: 12px; cursor: pointer; text-decoration: underline;">查看详情</span>
                    </div>
                </div>
            `).join('');
            
            table.innerHTML = html;
        }
        
        function updateStats(accounts) {
            const total = accounts.length;
            const enabled = accounts.filter(a => a.enabled).length;
            const disabled = total - enabled;
            const characterCount = accounts.filter(a => a.characterName).length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('enabledCount').textContent = enabled;
            document.getElementById('disabledCount').textContent = disabled;
            document.getElementById('characterCount').textContent = characterCount;
            document.getElementById('statsBar').style.display = 'grid';
        }
        
        function filterAccounts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = currentAccounts.filter(account => {
                return (account.nickname && account.nickname.toLowerCase().includes(searchTerm)) ||
                       (account.characterName && account.characterName.toLowerCase().includes(searchTerm)) ||
                       (account.serverName && account.serverName.toLowerCase().includes(searchTerm)) ||
                       (account.guildName && account.guildName.toLowerCase().includes(searchTerm));
            });
            renderAccounts(filtered);
        }
        
        function openModal(accountId) {
            const account = currentAccounts.find(a => a.accountId === accountId);
            if (!account) return;
            
            let html = '';
            
            if (account.loginError) {
                html += `
                    <div class="error-box">
                        <p>⚠️ ${account.loginError}</p>
                        <p style="margin-top:8px;"><a href="login.html">前往重新登录</a></p>
                    </div>
                `;
            }
            
            if (account.characterName) {
                html += `
                    <div class="detail-section">
                        <h3>角色信息</h3>
                        <div class="detail-grid">
                            <div class="detail-row"><span class="detail-label">角色名</span><span class="detail-value">${account.characterName}</span></div>
                            <div class="detail-row"><span class="detail-label">服务器</span><span class="detail-value">${account.serverName || '-'}</span></div>
                            <div class="detail-row"><span class="detail-label">部队</span><span class="detail-value">${account.guildName || account.groupName || '-'}</span></div>
                            <div class="detail-row"><span class="detail-label">部队标签</span><span class="detail-value">${account.guildTag || '-'}</span></div>
                            <div class="detail-row"><span class="detail-label">游戏时长</span><span class="detail-value">${account.playTime || '-'}</span></div>
                            <div class="detail-row"><span class="detail-label">房屋信息</span><span class="detail-value">${account.houseInfoPublish === 1 ? '已发布' : '未发布'}</span></div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="detail-section">
                        <h3>角色信息</h3>
                        <p style="color: var(--text-secondary); font-size: 14px;">未绑定角色，请在登录页面登录后绑定</p>
                    </div>
                `;
            }
            
            html += `
                <div class="detail-section">
                    <h3>账号信息</h3>
                    <div class="detail-grid">
                        <div class="detail-row"><span class="detail-label">账号昵称</span><span class="detail-value">${account.nickname || account.accountId}</span></div>
                        <div class="detail-row"><span class="detail-label">账号ID</span><span class="detail-value">${account.accountId}</span></div>
                        <div class="detail-row"><span class="detail-label">状态</span><span class="detail-value">${account.enabled ? '已启用' : '已禁用'}</span></div>
                        <div class="detail-row"><span class="detail-label">默认API账号</span><span class="detail-value">${account.defaultForApi ? '是' : '否'}</span></div>
                        <div class="detail-row"><span class="detail-label">UUID</span><span class="detail-value">${account.uuid || '-'}</span></div>
                        <div class="detail-row"><span class="detail-label">上次登录</span><span class="detail-value">${account.lastLoginTime || '-'}</span></div>
                    </div>
                </div>
            `;
            
            if (account.lastSignInTime) {
                html += `
                    <div class="detail-section">
                        <h3>签到信息</h3>
                        <div class="detail-grid">
                            <div class="detail-row"><span class="detail-label">上次签到</span><span class="detail-value">${formatTime(account.lastSignInTime)}</span></div>
                            <div class="detail-row"><span class="detail-label">签到结果</span><span class="detail-value">${account.lastSignInResult || '未知'}</span></div>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('characterDetailModal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('characterDetailModal').classList.remove('show');
        }
        
        function formatTime(timestamp) {
            if (!timestamp) return '从未';
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('character-detail-modal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
